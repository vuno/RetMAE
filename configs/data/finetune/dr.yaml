_target_: src.tasks.pretrain.datamodule.TransferLearningDM
root: ${paths.data_root}/DATASET_UNIFIED_V1
image_folder_name: images
label_file_name: labels
suffix: base_proc-224x224
train_batch_size: 8
val_batch_size: 8
test_batch_size: 8
num_workers: 6
persistent_workers: True
prefetch_factor: 4
pin_memory: True
fill_nan: null

dataset_list:
  train:
    - IDRiD
    - RFMiD
  val:
    - IDRiD
    - RFMiD
  test:
    - APTOS
    - IDRiD
    - RFMiD

target_class:
  - DiabeticRetinopathy
