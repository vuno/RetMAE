task_name: ssl-${run_name_postfix}-${seed}
tags:
- dev
train: true
test: false
ckpt_path: null
seed: 42
data:
  _target_: src.tasks.pretrain.datamodule.SelfSupMultiDM
  root: /data1/seunghoon/DATASET
  image_folder_name: images
  label_file_name: labels-duplicate_rm
  suffix: base_proc-224x224
  train_batch_size: 96
  val_batch_size: 128
  test_batch_size: 128
  num_workers: 8
  persistent_workers: false
  prefetch_factor: 1
  pin_memory: true
  val_ratio: 0.1
  fill_nan: null
  dataset_list:
    train:
    - DiaRetDB2
    - OIA-DDR
    - REFUGE
    - 1000fundus
    - DR1-2
    - DRD
    - drimdb
    - DRIONS-DB
    - FGADR
    - FIRE
    - FUND-OCT
    - G1020
    - HEI-MED
    - HRF
    - IOSTAR
    - JICHI
    - JustRAIGS
    - LAG
    - LES
    - MSHF
    - ODIR
    - ORIGA
    - PALM
    - PAPILA
    - RC-RGB-MA
    - RetinalLesion
    - RIDB
    - RIGA
    - ROC
    - SUSTech-SYSU
    - TREND
    - AGAR300
    - ARIA
    - AVRDB
    - Benitez
    - BRSET
    - Cataract
    - DeepDRiD
    - DiaRetDB1
    val:
    - BH
  teacher: true
  teacher_name: flair
model:
  _target_: src.tasks.pretrain.module.FundusMiMAEModule
  encoder:
    _target_: src.tasks.pretrain.encoder.SSLEncoder
    algorithm: FmiMAE
    pretrained: true
    ckpt_path: null
    img_size: 224
    patch_size: 14
    in_chans: 3
    embed_dim: 768
    depth: 12
    num_heads: 12
    mlp_ratio: 4.0
    reg_tokens: 4
    drop_rate: 0.0
    pos_drop_rate: 0.0
    patch_drop_rate: 0.0
    proj_drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.0
    standardize: true
    norm_layer:
      _target_: torch.nn.LayerNorm
      _partial_: true
    mask_ratio: 0.8
    visible_ratio: 0.0
    random_masking: true
    model_name: timm/vit_base_patch14_reg4_dinov2.lvd142m
    load_ckpt_strict: true
    dynamic_img_size: true
  decoder:
    _target_: src.tasks.pretrain.decoder.MAEDecoder
    image_size: 224
    patch_size: 14
    in_chans: 3
    embed_dim: 768
    decoder_embed_dim: 512
    decoder_depth: 8
    decoder_num_heads: 16
    mlp_ratio: 4.0
    norm_layer:
      _target_: torch.nn.LayerNorm
      _partial_: true
    reg_tokens: 4
  target_generator:
    _target_: src.tasks.pretrain.target_generator.NormalizedPixelsGenerator
    patch_size: 14
  mi_max_teacher:
    _target_: src.tasks.pretrain.backbone.MINE
    x_dim: 768
    y_dim: 512
    hidden_dim: 1024
  mi_max_high_freq:
    _target_: src.tasks.pretrain.backbone.MINE
    x_dim: 768
    y_dim: 512
    hidden_dim: 1024
  criterion_main:
    _target_: src.tasks.pretrain.criterion.MAELoss
    criterion: l2
    reduce: false
  optimizer_main:
    _target_: torch.optim.AdamW
    _partial_: true
    betas:
    - 0.9
    - 0.95
    lr: 0.0003
    weight_decay: 0.01
  wd_schedule_main:
    _target_: src.tasks.pretrain.utils.cosine_scheduler
    _partial_: true
    base_value: 1.0e-05
    final_value: 0.01
    epochs: ${trainer.max_epochs}
  lr_schedule_main:
    _target_: src.tasks.pretrain.utils.cosine_scheduler
    _partial_: true
    final_value: 1.0e-05
    start_warmup_value: 1.0e-06
    epochs: ${trainer.max_epochs}
    warmup_epochs: 20
  compile: true
  batch_size: ${data.train_batch_size}
  num_devices: ${trainer.devices}
  num_nodes: ${trainer.num_nodes}
  gradient_accumulation_steps: 1
  gradient_clip_val: 3
  lambda_rec: 1.0
  lambda_teacher: 0.1
  lambda_high_freq: 0.1
  monitor: val/avg/PED_SFDA_Score
callbacks:
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: 1
  rich_progress_bar:
    _target_: lightning.pytorch.callbacks.RichProgressBar
  lr_monitor:
    logging_interval: epoch
  model_checkpoint_module:
    _target_: src.tasks.pretrain.callbacks.EncoderCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: epoch_{epoch:07d}
    save_top_k: -1
    auto_insert_metric_name: false
    save_weights_only: true
    save_on_train_epoch_end: true
    every_n_epochs: ${trainer.check_val_every_n_epoch}
logger:
  aim:
    _target_: aim.pytorch_lightning.AimLogger
    repo: ${paths.log_dir}/aim
    experiment: ${task_name}
    train_metric_prefix: train/
    val_metric_prefix: val/
    test_metric_prefix: test/
    system_tracking_interval: 10
    log_system_params: true
    capture_terminal_logs: false
  csv:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${hydra:runtime.output_dir}
trainer:
  _target_: lightning.pytorch.Trainer
  accelerator: gpu
  strategy: ddp_find_unused_parameters_false
  devices: 8
  precision: 32-true
  max_epochs: 100
  num_nodes: 1
  sync_batchnorm: true
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 10
paths:
  root_dir: /team/team_fundus/personal/seunghoon/save/fundus_ssl/logs
  log_dir: ${paths.root_dir}
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
run_name_postfix: FMI-MAE_base_224_${model.encoder.patch_size}
